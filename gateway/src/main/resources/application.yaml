server:
  port: 8091
spring:
  application:
    name: gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      server:
        webmvc:
            routes:
              - id: auth-service-route
                uri: lb://auth-service
                predicates:
                     - Path=/auth/v1/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
jwt:
  public-key-path: classpath:public.pem
